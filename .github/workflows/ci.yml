name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend Tests (PostgreSQL / Flyway)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_resume_optimizer_test
          POSTGRES_USER: dawn
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dawn -d ai_resume_optimizer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_PROFILES_ACTIVE: test
      TEST_JWT_SECRET: ci-jwt-secret-change-me-at-least-32-chars
      TEST_DB_URL: jdbc:postgresql://localhost:5432/ai_resume_optimizer_test
      TEST_DB_USERNAME: dawn
      TEST_DB_PASSWORD: test_password
      DASHSCOPE_API_KEY: ""
      MINIO_INTEGRATION_ENABLED: "true"
      TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
      TEST_MINIO_ACCESS_KEY: phase9-test-minio
      TEST_MINIO_SECRET_KEY: phase9-test-minio-secret
      TEST_MINIO_BUCKET: phase9-integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Typst compiler and production fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils fonts-noto-cjk
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz -o /tmp/typst.tar.xz
          echo 'a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz' | sha256sum -c -
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          sudo chmod +x /usr/local/bin/typst
          typst --version
          FONT_DIR=$(dirname "$(find /usr/share/fonts -type f -name 'NotoSansCJK-Regular.ttc' | head -n 1)")
          test -n "$FONT_DIR" && echo "APP_RENDER_FONT_PATH=$FONT_DIR" >> "$GITHUB_ENV"

      - name: Start ephemeral MinIO lifecycle target
        run: |
          docker run -d --name phase9-minio \
            -e MINIO_ROOT_USER="$TEST_MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$TEST_MINIO_SECRET_KEY" \
            -p 9000:9000 minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in {1..30}; do
            if curl -fsS "$TEST_MINIO_ENDPOINT/minio/health/live" >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs phase9-minio
          exit 1

      - name: Run backend tests, including real PostgreSQL/Flyway and MinIO integration
        run: ./mvnw test

  frontend:
    name: Frontend Unit / Type / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run frontend unit tests
        run: npm test

      - name: Run non-mutating lint
        run: npm run lint:check

      - name: Run type check
        run: npm run type-check

      - name: Build frontend
        run: npm run build

  ops:
    name: Production Compose / Ops Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate ops scripts
        run: |
          bash -n scripts/ops/*.sh
          bash -n deploy/nginx/entrypoint/40-configure-production.sh

      - name: Render local Compose configuration
        run: docker compose config >/dev/null

      - name: Render production Compose configuration with safe placeholders
        run: |
          cat > "$RUNNER_TEMP/cv-role-production.env" <<'EOF'
          POSTGRES_DB=cv_role_ci
          POSTGRES_USER=cv_role_ci
          POSTGRES_PASSWORD=ci-postgres-placeholder
          REDIS_PASSWORD=ci-redis-placeholder
          MINIO_ROOT_USER=cv-role-ci-minio
          MINIO_ROOT_PASSWORD=ci-minio-placeholder
          MINIO_ACCESS_KEY=cv-role-ci-minio
          MINIO_SECRET_KEY=ci-minio-placeholder
          MINIO_BUCKET=cv-role-ci
          JWT_SECRET=ci-jwt-secret-at-least-32-characters-long
          AI_API_KEY=ci-ai-placeholder
          AI_BASE_URL=https://example.invalid/v1
          AI_MODEL=ci-model
          EMBEDDING_API_KEY=ci-embedding-placeholder
          EMBEDDING_BASE_URL=https://example.invalid/v1
          EMBEDDING_MODEL=ci-embedding-model
          APP_CORS_ALLOWED_ORIGIN_PATTERNS=https://example.invalid
          DEPLOY_DOMAIN=example.invalid
          CERTBOT_EMAIL=ci@example.invalid
          EOF
          docker compose -f docker-compose.prod.yml --env-file "$RUNNER_TEMP/cv-role-production.env" config >/dev/null

      - name: Build production backend image
        run: docker build -f backend/Dockerfile -t cv-role-backend-ci .

      - name: Build production frontend / Nginx image
        run: docker build -f web/Dockerfile -t cv-role-web-ci .

  runtime-restart:
    name: Production Runtime Restart Validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPS_PROJECT: cv-role-ops-ci-${{ github.run_id }}
      OPS_HTTP_PORT: "18080"
      OPS_HTTPS_PORT: "18443"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run production-shaped runtime restart Gate
        shell: bash
        run: |
          set -Eeuo pipefail

          OPS_ENV="$RUNNER_TEMP/cv-role-ops-runtime.env"
          COMPOSE=(docker compose -p "$OPS_PROJECT" -f docker-compose.prod.yml --env-file "$OPS_ENV")
          MC_IMAGE="minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727"
          DB_MARKER="cv-role-runtime-restart-${GITHUB_RUN_ID}"
          OBJECT_MARKER="cv-role-runtime-restart-${GITHUB_RUN_ID}\n"
          OBJECT_FILE="$RUNNER_TEMP/cv-role-runtime-marker.txt"
          printf '%b' "$OBJECT_MARKER" > "$OBJECT_FILE"

          cat > "$OPS_ENV" <<EOF
          POSTGRES_DB=cv_role_ops_ci
          POSTGRES_USER=cv_role_ops_ci
          POSTGRES_PASSWORD=ci-postgres-placeholder
          REDIS_PASSWORD=ci-redis-placeholder
          MINIO_ROOT_USER=cv-role-ci-minio
          MINIO_ROOT_PASSWORD=ci-minio-placeholder
          MINIO_ACCESS_KEY=cv-role-ci-minio
          MINIO_SECRET_KEY=ci-minio-placeholder
          MINIO_BUCKET=cv-role-ops-ci
          JWT_SECRET=ci-jwt-secret-at-least-32-characters-long
          AI_API_KEY=ci-ai-placeholder
          AI_BASE_URL=https://example.invalid/v1
          AI_MODEL=ci-model
          EMBEDDING_API_KEY=ci-embedding-placeholder
          EMBEDDING_BASE_URL=https://example.invalid/v1
          EMBEDDING_MODEL=ci-embedding-model
          APP_CORS_ALLOWED_ORIGIN_PATTERNS=http://127.0.0.1:${OPS_HTTP_PORT}
          DEPLOY_DOMAIN=example.invalid
          CERTBOT_EMAIL=ci@example.invalid
          NGINX_HTTP_PORT=${OPS_HTTP_PORT}
          NGINX_HTTPS_PORT=${OPS_HTTPS_PORT}
          EOF

          diagnostics() {
            echo '--- docker compose ps ---'
            "${COMPOSE[@]}" ps || true
            for service in postgres redis minio backend nginx; do
              echo "--- $service logs (tail 200) ---"
              "${COMPOSE[@]}" logs --no-color --tail=200 "$service" || true
            done
          }

          cleanup() {
            local result=$?
            if [[ "$result" -ne 0 ]]; then
              diagnostics
            fi
            "${COMPOSE[@]}" down -v --remove-orphans || true
            exit "$result"
          }
          trap cleanup EXIT

          wait_healthy() {
            local service="$1"
            local container state health
            for attempt in {1..180}; do
              container=$("${COMPOSE[@]}" ps -q "$service" 2>/dev/null || true)
              if [[ -n "$container" ]]; then
                state=$(docker inspect -f '{{.State.Status}}' "$container")
                health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")
                if [[ "$state" == running && "$health" == healthy ]]; then
                  echo "$service: running/healthy"
                  return 0
                fi
              fi
              sleep 2
            done
            echo "Timed out waiting for $service to become running/healthy" >&2
            return 1
          }

          wait_completed() {
            local service="$1"
            local container state exit_code
            for attempt in {1..120}; do
              container=$("${COMPOSE[@]}" ps -a -q "$service" 2>/dev/null || true)
              if [[ -n "$container" ]]; then
                state=$(docker inspect -f '{{.State.Status}}' "$container")
                exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$container")
                if [[ "$state" == exited && "$exit_code" == 0 ]]; then
                  echo "$service: completed successfully"
                  return 0
                fi
                if [[ "$state" == exited && "$exit_code" != 0 ]]; then
                  echo "$service exited with code $exit_code" >&2
                  return 1
                fi
              fi
              sleep 2
            done
            echo "Timed out waiting for $service to complete" >&2
            return 1
          }

          wait_core() {
            wait_healthy postgres
            wait_healthy redis
            wait_healthy minio
            wait_completed minio-init
            wait_healthy backend
            wait_healthy nginx
          }

          smoke() {
            BASE_URL="http://127.0.0.1:${OPS_HTTP_PORT}" scripts/ops/smoke-check.sh
          }

          db_marker() {
            "${COMPOSE[@]}" exec -T postgres sh -c \
              'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT marker FROM ops_ci_restart_marker WHERE id = 1"'
          }

          put_object_marker() {
            docker run --rm --network "${OPS_PROJECT}_default" \
              -e MINIO_ROOT_USER=cv-role-ci-minio \
              -e MINIO_ROOT_PASSWORD=ci-minio-placeholder \
              -e MINIO_BUCKET=cv-role-ops-ci \
              -v "$OBJECT_FILE:/tmp/runtime-marker.txt:ro" \
              --entrypoint /bin/sh "$MC_IMAGE" -c \
              'mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null && mc cp /tmp/runtime-marker.txt "local/$MINIO_BUCKET/runtime-restart-marker.txt" >/dev/null'
          }

          object_sha() {
            docker run --rm --network "${OPS_PROJECT}_default" \
              -e MINIO_ROOT_USER=cv-role-ci-minio \
              -e MINIO_ROOT_PASSWORD=ci-minio-placeholder \
              -e MINIO_BUCKET=cv-role-ops-ci \
              --entrypoint /bin/sh "$MC_IMAGE" -c \
              'mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null && mc cat "local/$MINIO_BUCKET/runtime-restart-marker.txt" | sha256sum | cut -d " " -f1'
          }

          echo 'Starting isolated production-shaped Compose project'
          "${COMPOSE[@]}" up -d --build
          wait_core
          smoke

          "${COMPOSE[@]}" exec -T postgres sh -c \
            "psql -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \"CREATE TABLE IF NOT EXISTS ops_ci_restart_marker (id integer PRIMARY KEY, marker text NOT NULL); INSERT INTO ops_ci_restart_marker (id, marker) VALUES (1, '$DB_MARKER') ON CONFLICT (id) DO UPDATE SET marker = EXCLUDED.marker;\""
          put_object_marker
          EXPECTED_OBJECT_SHA=$(sha256sum "$OBJECT_FILE" | cut -d ' ' -f1)
          [[ "$(object_sha)" == "$EXPECTED_OBJECT_SHA" ]]

          echo 'Restarting backend only'
          "${COMPOSE[@]}" restart backend
          wait_healthy backend
          wait_healthy nginx
          smoke
          if "${COMPOSE[@]}" logs --no-color backend | grep -Eiq 'flyway.*(error|fail)|migration.*(error|fail)'; then
            echo 'Backend logs contain a Flyway/migration failure' >&2
            exit 1
          fi

          echo 'Restarting Redis only'
          "${COMPOSE[@]}" restart redis
          wait_healthy redis
          wait_healthy backend
          wait_healthy nginx
          smoke

          echo 'Restarting Nginx only'
          "${COMPOSE[@]}" restart nginx
          wait_healthy nginx
          smoke

          echo 'Restarting MinIO only'
          "${COMPOSE[@]}" restart minio
          wait_healthy minio
          wait_healthy backend
          wait_healthy nginx
          [[ "$(object_sha)" == "$EXPECTED_OBJECT_SHA" ]]
          smoke

          [[ "$(db_marker)" == "$DB_MARKER" ]]
          echo 'Production-shaped runtime restart Gate passed'

  phase9-e2e:
    name: Phase 9 Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_resume_optimizer_test
          POSTGRES_USER: dawn
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dawn -d ai_resume_optimizer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_JWT_SECRET: ci-phase9-e2e-jwt-secret-change-me-at-least-32-chars
      TEST_DB_URL: jdbc:postgresql://localhost:5432/ai_resume_optimizer_test
      TEST_DB_USERNAME: dawn
      TEST_DB_PASSWORD: test_password
      APP_STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: phase9-e2e-minio
      MINIO_SECRET_KEY: phase9-e2e-minio-secret
      MINIO_BUCKET: phase9-e2e
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Typst compiler and production fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils fonts-noto-cjk
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz -o /tmp/typst.tar.xz
          echo 'a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz' | sha256sum -c -
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          sudo chmod +x /usr/local/bin/typst
          FONT_DIR=$(dirname "$(find /usr/share/fonts -type f -name 'NotoSansCJK-Regular.ttc' | head -n 1)")
          test -n "$FONT_DIR" && echo "APP_RENDER_FONT_PATH=$FONT_DIR" >> "$GITHUB_ENV"

      - name: Install frontend and Chromium dependencies
        working-directory: web
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium

      - name: Start ephemeral MinIO for the browser's real storage path
        run: |
          docker run -d --name phase9-e2e-minio \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            -p 9000:9000 minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in {1..30}; do
            if curl -fsS "$MINIO_ENDPOINT/minio/health/live" >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs phase9-e2e-minio
          exit 1

      - name: Start deterministic fake-provider backend
        run: |
          (
            cd backend
            SPRING_PROFILES_ACTIVE=phase9-e2e ./mvnw spring-boot:run \
              >"$RUNNER_TEMP/phase9-backend.log" 2>&1 &
            echo $! >"$RUNNER_TEMP/phase9-backend.pid"
          )
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/v3/api-docs >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/phase9-backend.log"
          exit 1

      - name: Start frontend
        run: |
          (
            cd web
            VITE_API_BASE_URL=http://127.0.0.1:8080 npm run dev -- --host 127.0.0.1 --port 5173 \
              >"$RUNNER_TEMP/phase9-frontend.log" 2>&1 &
            echo $! >"$RUNNER_TEMP/phase9-frontend.pid"
          )
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/phase9-frontend.log"
          exit 1

      - name: Run Chromium recovery flows
        working-directory: web
        run: npm run test:e2e

      - name: Capture MinIO diagnostics
        if: always()
        run: docker logs phase9-e2e-minio >"$RUNNER_TEMP/phase9-e2e-minio.log" 2>&1 || true

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-e2e-artifacts
          path: |
            ${{ runner.temp }}/phase9-backend.log
            ${{ runner.temp }}/phase9-frontend.log
            ${{ runner.temp }}/phase9-e2e-minio.log
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
