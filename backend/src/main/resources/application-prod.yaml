spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

app:
  security:
    cors:
      allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS}
  async:
    core-pool-size: ${APP_ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${APP_ASYNC_MAX_POOL_SIZE:8}
    queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:100}
    thread-name-prefix: ${APP_ASYNC_THREAD_NAME_PREFIX:ai-resume-task-}
    await-termination-seconds: ${APP_ASYNC_AWAIT_TERMINATION_SECONDS:30}
  storage:
    type: ${APP_STORAGE_TYPE:minio}
    local:
      base-dir: ${APP_STORAGE_LOCAL_BASE_DIR}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://minio:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:ai-resume-files}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
  ai:
    # Chat credentials are never supplied by the platform in production.
    # Runtime generation is selected only from the current user's encrypted BYOK.
    credentials:
      enabled: true
      active-key-id: ${AI_CREDENTIALS_ACTIVE_KEY_ID:?AI_CREDENTIALS_ACTIVE_KEY_ID is required}
      key-ring: ${AI_CREDENTIALS_KEY_RING:?AI_CREDENTIALS_KEY_RING is required}
    embedding-compatible:
      api-key: ${EMBEDDING_API_KEY:}
      base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
      model: ${EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
      dimension: ${EMBEDDING_DIMENSION:1024}
      timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:120}
      max-input-length: ${EMBEDDING_MAX_INPUT_LENGTH:8000}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:info}
    com.winter.airesumeoptimizer: ${LOG_LEVEL_APP:info}
