server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-resume-optimizer-backend
  profiles:
    default: local
  ai:
    # Spring AI's optional audio starter must not create a platform-owned
    # provider bean. Generation is handled by the credential-aware gateway.
    model:
      audio:
        speech: none
    openai:
      # Legacy adapter properties are test-only transport settings. Production
      # generation uses the current user's encrypted BYOK selection instead.
      api-key: ${REAL_AI_API_KEY:}
      base-url: ${REAL_AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${REAL_AI_MODEL:deepseek-v4-flash}
          temperature: ${AI_TEMPERATURE:${OPENAI_TEMPERATURE:0.2}}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:info}

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

app:
  security:
    cors:
      allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://localhost:5173,http://localhost:5174,http://localhost:5175}
  cache:
    redis:
      enabled: ${APP_REDIS_CACHE_ENABLED:true}
      default-ttl-seconds: ${APP_REDIS_DEFAULT_TTL_SECONDS:86400}
      ai-display-model-ttl-seconds: ${APP_REDIS_AI_DISPLAY_MODEL_TTL_SECONDS:86400}
      key-prefix: ${APP_REDIS_KEY_PREFIX:ai-resume-optimizer}
  async:
    core-pool-size: ${APP_ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${APP_ASYNC_MAX_POOL_SIZE:8}
    queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:100}
    thread-name-prefix: ${APP_ASYNC_THREAD_NAME_PREFIX:ai-resume-task-}
    await-termination-seconds: ${APP_ASYNC_AWAIT_TERMINATION_SECONDS:30}
  storage:
    type: ${APP_STORAGE_TYPE:local}
    local:
      base-dir: ${APP_STORAGE_LOCAL_BASE_DIR:${LOCAL_STORAGE_BASE_DIR:uploads}}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:ai-resume-files}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
  resume:
    upload:
      max-file-size-bytes: 10485760
  render:
    typst-binary: ${APP_RENDER_TYPST_BINARY:typst}
    timeout: ${APP_RENDER_TIMEOUT:30s}
    font-path: ${APP_RENDER_FONT_PATH:}
    preview-receipt-ttl: ${APP_RENDER_PREVIEW_RECEIPT_TTL:10m}
    parse:
      mode: ${RESUME_PARSE_MODE:BALANCED}
      ai-section-classify-enabled: ${RESUME_PARSE_AI_SECTION_CLASSIFY_ENABLED:true}
      ai-section-classify-min-confidence: ${RESUME_PARSE_AI_SECTION_CLASSIFY_MIN_CONFIDENCE:0.6}
      ai-structured-parse-enabled: ${RESUME_PARSE_AI_STRUCTURED_PARSE_ENABLED:false}
      ai-max-blocks: ${RESUME_PARSE_AI_MAX_BLOCKS:80}
      ai-section-classify-batch-max-chars: ${RESUME_PARSE_AI_SECTION_CLASSIFY_BATCH_MAX_CHARS:6000}
  ai:
    openai-compatible:
      api-key: ${spring.ai.openai.api-key}
      base-url: ${spring.ai.openai.base-url}
      model: ${spring.ai.openai.chat.options.model}
      timeout-seconds: ${AI_TIMEOUT_SECONDS:${OPENAI_TIMEOUT_SECONDS:90}}
      temperature: ${AI_TEMPERATURE:${OPENAI_TEMPERATURE:0.2}}
      max-tokens: ${AI_MAX_TOKENS:${OPENAI_MAX_TOKENS:16000}}
    credentials:
      enabled: ${AI_CREDENTIALS_ENABLED:false}
      active-key-id: ${AI_CREDENTIALS_ACTIVE_KEY_ID:v1}
      key-ring: ${AI_CREDENTIALS_KEY_RING:}
    usage:
      retention:
        enabled: ${AI_USAGE_RETENTION_ENABLED:true}
        days: ${AI_USAGE_RETENTION_DAYS:90}
        cron: "${AI_USAGE_RETENTION_CRON:0 17 3 * * *}"
    embedding-compatible:
      api-key: ${EMBEDDING_API_KEY:}
      base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
      model: ${EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
      dimension: ${EMBEDDING_DIMENSION:1024}
      timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:120}
      max-input-length: ${EMBEDDING_MAX_INPUT_LENGTH:8000}
